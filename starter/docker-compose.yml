services:
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: twin-timescale
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-twin}
      POSTGRES_USER: ${POSTGRES_USER:-twin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: twin-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.2
    container_name: twin-mlflow
    restart: unless-stopped
    # MLFLOW_ARTIFACT_ROOT defaults to the local volume; point it at
    # s3://<bucket>/mlflow-artifacts (plus AWS creds in .env) for cloud backup.
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://${POSTGRES_USER:-twin}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-twin} --default-artifact-root ${MLFLOW_ARTIFACT_ROOT:-/mlflow-artifacts}
    environment:
      AWS_REGION: ${AWS_REGION:-ca-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - mlflow-artifacts:/mlflow-artifacts

  ignition:
    image: inductiveautomation/ignition:8.3
    container_name: twin-ignition
    restart: unless-stopped
    ports:
      - "8088:8088"
      - "8043:8043"
    environment:
      ACCEPT_IGNITION_EULA: Y
      IGNITION_EDITION: standard
      GATEWAY_ADMIN_USERNAME: admin
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:-change_me_too}
      TZ: ${TZ:-America/Toronto}
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
    command: -n twin-gateway -m 2048
    depends_on:
      - db
      - mosquitto

volumes:
  timescale-data:
  mlflow-artifacts:
  ignition-data:
